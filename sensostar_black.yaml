# ============================================================
# sensostar_black.yaml  —  Hardware-Variante: ESP32-S3 / WiFi
# Flash:  esphome upload sensostar_black.yaml --device COMxx
# Erase:  esptool --port COMxx erase_flash
# ============================================================

esphome:
  name: sensostar
  name_add_mac_suffix: true
  comment: SensoStar Energy Meter
  platformio_options:
    board_build.arduino.memory_type: qio_opi

# ----- Chip-Definition (S3) ---------------------------------
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_SPIRAM_SUPPORT: "n"
    # type: arduino  # arduino nur ab >= 2MB PSRAM

# ----- Board-spezifischer Logger ----------------------------
# level: info kommt aus der base; hier nur die UART-Anbindung.
logger:
  hardware_uart: UART0
  baud_rate: 115200

# ----- Board-spezifische Pinbelegung (S3) -------------------
substitutions:
  pin_uart_tx:     GPIO39
  pin_uart_rx:     GPIO38
  pin_adc_input:   GPIO1
  pin_adc_control: GPIO14
  pin_heartbeat:   GPIO42
  pin_wifi_led:    GPIO2
  pin_mbus_data:   GPIO41
  pin_mbus_yellow: GPIO40

# ----- Module -----------------------------------------------
packages:
  base:         !include packages/sensostar_base.yaml
  connectivity: !include packages/sensostar_wifi.yaml
