# ============================================================
# sensostar_eth.yaml
# Ethernet-Konnektivitäts-Modul (Hardware: sensostar-blue)
# ============================================================

ethernet:
  type: W5500
  clk_pin: GPIO22
  mosi_pin: GPIO21
  miso_pin: GPIO20
  cs_pin: GPIO19
  interrupt_pin: GPIO15
  reset_pin: GPIO18

  on_connect:
    - output.turn_on: wifi_led    # gpio-id bleibt "wifi_led", zeigt hier Link-Status
    - lambda: |-
       if (id(mqtt_enabled).state) {
         ESP_LOGI("ETH", "ETH connected and MQTT switch is ON — enabling MQTT");
         id(mqtt_broker).enable();
       }

  on_disconnect:
    - output.turn_off: wifi_led

web_server:
  version: 2   # Ethernet W5500: nur 4 Sockets → Version 2, damit 1 Socket für OTA frei bleibt
  port: 80
