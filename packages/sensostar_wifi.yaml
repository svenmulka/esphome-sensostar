# ============================================================
# sensostar_wifi.yaml
# WiFi-Konnektivitäts-Modul (Hardware: sensostar-red)
# ============================================================

wifi:
  # ssid:     !secret wifi_ssid
  # password: !secret wifi_password
  power_save_mode: NONE
  ap:
    ssid: "Sensostar"
  reboot_timeout: 0s 
  
  on_connect:
      - script.stop: ap_mode_blink
      - output.turn_on: wifi_led
      - lambda: |-
          id(wifi_connected) = true;        // ← das fehlte
          if (id(mqtt_enabled).state) {
            ESP_LOGI("wifi", "Wi-Fi connected and MQTT switch is ON — enabling MQTT");
            id(mqtt_broker).enable();
          }

  on_disconnect:
      - lambda: |-
          id(wifi_connected) = false;       // ← damit Blink-Bedingung wieder greift
      - script.execute: ap_mode_blink

captive_portal:

web_server:
  version: 3   # WiFi: alle 4 Sockets verfügbar
  port: 80
  sorting_groups:
    # Panel with heat meter information 
    # display at front 
    - id: group_heat_meter
      name: "Heat Meter"
      sorting_weight: 0

    # Panel with WiFi information
    - id: group_wifi
      name: "WiFi"
      sorting_weight: 50

    # Panel with MQTT settings
    - id: group_mqt
      name: "MQTT"
      sorting_weight: 70

    # Panel with firmware information
    - id: group_firmware
      name: "Firmware"
      sorting_weight: 100

    # Panel with System buttons
    - id: group_system
      name: "System"
      sorting_weight: 110

# -------------------------------------------------------------------------
# WiFi Information
# -------------------------------------------------------------------------
# wifi_rssi   : Received signal strength (RSSI) in dBm
# wifi_ssid   : Name of the connected WiFi network
# wifi_bssid  : MAC address of the connected access point
# wifi_mac    : MAC address of the ESP32 WiFi interface
# wifi_ip     : IP address of the ESP32 WiFi interface
# -------------------------------------------------------------------------
text_sensor:
  - platform: wifi_info
    ssid:
      name: "WiFi SSID"
      id: wifi_ssid
      web_server:
        sorting_group_id: group_wifi
        sorting_weight: 20

    bssid:
      name: "WiFi BSSID"
      id: wifi_bssid
      web_server:
        sorting_group_id: group_wifi
        sorting_weight: 21

    mac_address:
      name: "WiFi MAC Address"
      id: wifi_mac
      web_server:
        sorting_group_id: group_wifi
        sorting_weight: 22

    ip_address:
      name: "WiFi IP Address"
      id: wifi_ip
      web_server:
        sorting_group_id: group_wifi
        sorting_weight: 23

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    id: wifi_rssi
    update_interval: 60s
    entity_category: diagnostic
    icon: "mdi:signal"
    web_server:
      sorting_group_id: group_wifi
      sorting_weight: 10

# ----- WiFi-spezifischer Button -----------------------------
button:
  - platform: template
    name: "WiFi Signal read"
    id: btn_wifi_signal_read
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_wifi
      sorting_weight: 11
    on_press:
      then:
        - component.update: wifi_rssi

# ----- AP-Mode Blink-Script ---------------------------------
script:
  - id: ap_mode_blink
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return !id(wifi_connected);'
          then:
            - output.turn_on: wifi_led
            - delay: 200ms
            - output.turn_off: wifi_led
            - delay: 1000ms

# ----- on_boot: AP-Blink starten falls kein WiFi ------------
# Wird an die on_boot-Liste aus sensostar_base.yaml angehängt.
esphome:
  on_boot:
    priority: -100  # nach NVS-Restore ausführen
    then:
      - lambda: |-
          if (!id(wifi_connected)) {
            id(ap_mode_blink).execute();
          }
