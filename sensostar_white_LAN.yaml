# ============================================================
# sensostar_white_LAN.yaml  —  Hardware-Variante: ESP32-C6 / Wired LAN (W5500)
# Flash:  esphome upload sensostar_blue.yaml --device COM12
# Erase:  esptool --port COM12 erase_flash
#
# Gleiche C6-Hauptplatine wie sensostar_red.yaml; der W5500 haengt
# ueber die FFC-Adapterplatine an der SPI. Die W5500-SPI-Pins
# (CLK/MISO/MOSI/CS/INT/RST) stehen im Connectivity-Modul
# packages/sensostar_eth.yaml, NICHT hier.
# ============================================================

esphome:
  name: sensostar-v3-lan
  name_add_mac_suffix: true
  comment: SensoStar Energy Meter
  platformio_options:
    board_build.arduino.memory_type: qio_opi

# ----- Chip-Definition (C6) ---------------------------------
esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

# ----- Board-spezifische Pinbelegung (C6, identisch zu Red) -
# Die W5500-SPI-Pins sind hiervon getrennt und liegen in
# packages/sensostar_eth.yaml.
substitutions:
  pin_uart_tx:     GPIO6
  pin_uart_rx:     GPIO7
  pin_adc_input:   GPIO1
  pin_adc_control: GPIO14
  pin_heartbeat:   GPIO4
  pin_wifi_led:    GPIO3   # bei LAN-Variante: Ethernet-Link-Status
  pin_mbus_data:   GPIO2
  pin_mbus_yellow: GPIO5

# ----- Module -----------------------------------------------
packages:
  stb3:         !include packages/sensostar_stb3.yaml
  base:         !include packages/sensostar_base.yaml
  connectivity: !include packages/sensostar_eth.yaml
